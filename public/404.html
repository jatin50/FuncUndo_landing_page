<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Function Not Found · FuncUndo</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #251D1A;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 520px;
      background: #FFFFFF;
      border: 2px solid #E8E1D5;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      background: #251D1A;
      color: #F7B93E;
      padding: 12px 16px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: left;
      overflow-x: auto;
    }
    .btn {
      display: inline-block;
      background: #C15C3D;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #A94B2E;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px; margin-bottom: 10px;">🔍 404</div>
    <h1 style="font-size: 24px; font-weight: 800; margin: 0 0 10px;">AST Node Not Found</h1>
    <p style="font-size: 14px; color: #5A5047; line-height: 1.5;">
      The function or page you were looking for doesn't exist in our timeline. It may have been garbage-collected or re-scoped.
    </p>
    <div class="code">
      <span style="color: #FF7B72;">error</span>: <span style="color: #A5D6FF;">404_PAGE_NOT_FOUND</span><br>
      <span style="color: #8B949E;">// Blast radius: 0 (Your browser is safe)</span>
    </div>
    <a href="/" class="btn">← Return to Safe Ground</a>
  </div>
</body>
</html>
